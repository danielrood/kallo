<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Helen's · On the line — Kallo</title>
  <meta name="description" content="Inbound receptionist for Helen's. Book, move, or cancel. Browser microphone only. Demo.">
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <main class="line">
    <header class="line__id">
      <img src="./assets/logo.svg" alt="Kallo" width="48" height="48">
      <p data-salon>Helen's</p>
      <p class="line__state"><span data-state>On the line</span> <span class="demo-pill">Demo</span></p>
    </header>

    <section class="turn" data-turn aria-live="polite">
      <p class="verb" data-verb>Booked</p>
      <p class="who" data-who>Priya Nair</p>
      <p class="what" data-what>cut and blow dry</p>
      <p class="when" data-when>Tuesday 2:30</p>
      <button class="confirm" type="button" data-confirm>That's right</button>
    </section>

    <form class="fallback" data-fallback data-fallback-form hidden>
      <label for="say">Same turn, typed</label>
      <input id="say" name="say" data-say autocomplete="off" placeholder="Book Priya Nair for a cut and blow dry on Tuesday at 2:30">
      <button type="submit">Continue</button>
    </form>
  </main>
  <script src="./js/speech.js"></script>
  <script src="./js/voice.js"></script>
  <script src="./js/reception.js"></script>
  <script src="./js/line.js"></script>
</body>
</html>
